name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily RustSec sweep (08:00 UTC) so newly disclosed advisories fail CI proactively.
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: taiki-e/install-action@cargo-audit

      - name: audit all Cargo.lock files against RustSec
        run: python3 .github/checks/security_audit.py --strict

      - name: dependency review against GitHub Advisory Database
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low

  structure:
    name: structural gates
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: interpreter
        run: python3 -V

      - name: apparatus, spine, links, figures, table B.1, ledger, citations, contents,
          concordance, guard sites, math, notation, attribution, falsifiers,
          concordance polarity, collapse refutation, guard footing, year citation,
          ledger coherence, ratio limit
        run: python3 .github/checks/structure.py

  core:
    name: normative core
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The runner's /tmp is a tmpfs, and the linker dies there with a bus error:
      # seven of the ten doctests never link (F7). Keep both the compiler's and
      # cargo's temporary files on the runner's disk instead.
      - name: temporary directory on disk
        run: |
          mkdir -p "$RUNNER_TEMP/rs-tmp"
          echo "TMPDIR=$RUNNER_TEMP/rs-tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/rs-tmp"

      # No external dependencies by contract: the workspace must build and test
      # with the network unavailable, so the flag is not a convenience.
      - name: workspace tests, offline
        run: cargo test --offline

      - name: core doctests, offline
        run: cargo test --doc --offline -p stoch-core

  wasm:
    name: wasm supply chain
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The gates read the module's bytes themselves; no wabt at all, so this
      # job does not depend on a tool the runner happens not to ship.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Same F7 as the core job, and the wasm build links through the same host
      # linker: temporary files must not land on the runner's tmpfs.
      - name: temporary directory on disk
        run: |
          mkdir -p "$RUNNER_TEMP/rs-tmp"
          echo "TMPDIR=$RUNNER_TEMP/rs-tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/rs-tmp"

      # C1-C6, C11-C14 of 03 §8, plus the rows that cannot be decided offline,
      # each reported open with its reason and never as pass. Every cargo
      # invocation inside the script runs `--offline --locked`, so the artifact
      # is built against the committed `Cargo.lock` and never against a lock the
      # runner re-resolved for itself.
      - name: release gates C1-C17
        run: python3 .github/checks/wasm_gates.py

      - name: wasm parity & mutation tests (Node 24, zero npm deps)
        run: |
          cargo build --release --offline --locked -p stoch-abi --target wasm32-unknown-unknown
          node --test adapters/ts/adapter.test.ts
          node adapters/ts/mutation.mjs
          node consumers/node/run.mjs

  adversarial-and-sanitizers:
    name: proptest, host-workspace, sanitizers, miri & repro-aot
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
          targets: wasm32-unknown-unknown

      - name: temporary directory on disk
        run: |
          mkdir -p "$RUNNER_TEMP/rs-tmp"
          echo "TMPDIR=$RUNNER_TEMP/rs-tmp" >> "$GITHUB_ENV"

      - name: build stoch-abi wasm artifact for Wasmtime parity
        run: cargo build --release --offline --locked -p stoch-abi --target wasm32-unknown-unknown

      - name: vendor locked host-workspace dependencies
        run: cargo vendor --locked --manifest-path crates/host-workspace/Cargo.toml vendor-host

      - name: property-based invariants, custody, host & wasmtime parity (host-workspace)
        working-directory: crates/host-workspace
        run: |
          cargo test --offline --locked
          cargo test --offline --locked -p stoch-host --features simulated-hsm-ffi
          cargo test --doc --offline --locked -p stoch-host

      - name: address sanitizer over HSM FFI seam (stoch-host)
        working-directory: crates/host-workspace
        env:
          RUSTFLAGS: "-Z sanitizer=address"
        run: cargo +nightly test --offline --locked --target x86_64-unknown-linux-gnu -p stoch-host --features simulated-hsm-ffi --test host_integration hsm_ffi

      - name: thread sanitizer over HSM FFI seam (stoch-host)
        env:
          RUSTFLAGS: "-Z sanitizer=thread"
        run: cargo +nightly test -Z build-std --locked --manifest-path crates/host-workspace/Cargo.toml --target-dir target/host-workspace-tsan --target x86_64-unknown-linux-gnu -p stoch-host --features simulated-hsm-ffi --test host_integration hsm_ffi

      - name: miri over pointer ABI boundary (stoch-abi)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --offline --locked -p stoch-abi --lib --test overlap --test port

      - name: deterministic AOT .wasm/.cwasm reproducibility & static Regime III-B gate
        run: python3 .github/checks/repro_aot.py

  render:
    name: render
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.3"

      - name: build the book
        run: mdbook build

      # §V-8 reads the built pages, so it runs here and not in the structure job.
      - name: published surface (§V-8)
        run: python3 .github/checks/surface.py book

      - name: pdf edition
        run: python3 .github/checks/build_pdf.py book book/stochology.pdf

      # Same hand-carry as the publish job: the artifact must render its formulas offline too.
      - name: vendored typesetting payload
        run: cp -r theme/mathjax book/mathjax

      - name: every chapter reaches a page
        run: |
          entries=$(grep -c '^\- \[' book-src/SUMMARY.md)
          pages=$(find book -name '*.html' | wc -l)
          echo "summary entries: $entries, html pages: $pages"
          if [ "$pages" -lt "$entries" ]; then
            echo "fewer pages than table-of-contents entries" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book
          retention-days: 7
