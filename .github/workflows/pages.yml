name: Deploy Site to GitHub Pages (stochology.org)

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "book-src/**"
      - "book.toml"
      - "mathjax.js"
      - "theme/**"
      - "crates/**"
      - "data/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Workspace & Build mdBook
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Toolchain pinned in rust-toolchain.toml
        run: rustup show

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install and run pre-commit verification (.pre-commit-config.yaml)
        run: |
          pipx install pre-commit || pip install --user pre-commit
          pre-commit run --all-files

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.3'

      - name: Build the book
        run: mdbook build

      - name: Verify staged artifact
        run: |
          test -f book/index.html
          test -f book/toc.html
          test -f book/mathjax.js
          test -f book/theme/book.css
          test -f book/00-preface.html
          test -f book/01-sequential-loop-naive-agent.html
          test -f book/02-inquiry-openness-multiverse.html
          test -f book/03-underdetermination-partial-identification.html
          test -f book/04-non-identical-asymmetry-heavy-tails.html
          test -f book/05-world-to-archive-big-data-paradox.html
          test -f book/06-reactive-worlds-performativity-goodhart.html
          test -f book/07-irreversible-time-vital-margin.html
          test -f book/08-moral-luck-apt-agency-institutions.html
          test -f book/09-methodological-families-reflexivity.html
          test -f book/appendix-a-mathematics.html
          test -f book/appendix-b-architecture-verification.html
          test -f book/appendix-c-sources.html
          test -f book/lab/index.html
          grep -qx "stochology.org" book/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact (book/)
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./book

  deploy:
    name: Publish to stochology.org
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
