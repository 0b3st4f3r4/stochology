# Virtual workspace root for the Pure-TCB Rust crates.
#
# The manuscript is not a program. Inside this workspace sit the normative core
# (`stoch-core`), its linear wasm boundary (`stoch-abi`), the normative harness
# (`stoch-vectors`), and the pure zero-dependency extensions (`stoch-math` and
# `stoch-crdt`). Host/runtime tooling lives separately in `crates/host-workspace`.
[workspace]
resolver = "2"
members = [
    "crates/stoch-core",
    "crates/stoch-vectors",
    "crates/stoch-abi",
    "crates/stoch-math",
    "crates/stoch-crdt",
]
exclude = [
    "crates/host-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/0b3st4f3r4/stochology"
