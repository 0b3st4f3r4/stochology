<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" fill="none" role="img" aria-labelledby="title-fig-01-loop">
  <title id="title-fig-01-loop">The Sequential Agent–World–Institution Loop (CommunityReserveEnv)</title>
  <defs>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--muted)"/>
    </marker>
  <style>
    svg:root {
      color-scheme: light dark;
      --font-sans: "Inter", "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono-font: "JetBrains Mono", "Source Code Pro", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      --canvas: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --surface: #ffffff;
      --elevated: #f1f5f9;
      --border: #cbd5e1;
      --sky: #1d4ed8;
      --sky-bg: #dbeafe;
      --violet: #e11d48;
      --violet-bg: #ffe4e6;
      --emerald: #047857;
      --emerald-bg: #d1fae5;
      --amber: #b45309;
      --amber-bg: #fef3c7;
      --rose: #be123c;
      --rose-bg: #ffe4e6;
    }
    @media (prefers-color-scheme: dark) {
      svg:root {
        --canvas: #0f1626;
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --surface: #0f1626;
        --elevated: #162036;
        --border: #1e2d4a;
        --sky: #38bdf8;
        --sky-bg: #0c2644;
        --violet: #fb7185;
        --violet-bg: #3b101d;
        --emerald: #34d399;
        --emerald-bg: #092e26;
        --amber: #fbbf24;
        --amber-bg: #362407;
        --rose: #fb7185;
        --rose-bg: #3b101d;
      }
    }
    @supports (color: light-dark(white, black)) {
      svg:root {
        --canvas: light-dark(#ffffff, #0f1626);
        --ink: light-dark(#0f172a, #e2e8f0);
        --muted: light-dark(#475569, #94a3b8);
        --surface: light-dark(#ffffff, #0f1626);
        --elevated: light-dark(#f1f5f9, #162036);
        --border: light-dark(#cbd5e1, #1e2d4a);
        --sky: light-dark(#1d4ed8, #38bdf8);
        --sky-bg: light-dark(#dbeafe, #0c2644);
        --violet: light-dark(#e11d48, #fb7185);
        --violet-bg: light-dark(#ffe4e6, #3b101d);
        --emerald: light-dark(#047857, #34d399);
        --emerald-bg: light-dark(#d1fae5, #092e26);
        --amber: light-dark(#b45309, #fbbf24);
        --amber-bg: light-dark(#fef3c7, #362407);
        --rose: light-dark(#be123c, #fb7185);
        --rose-bg: light-dark(#ffe4e6, #3b101d);
      }
    }
    text { font-family: var(--font-sans, "Inter", "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
    .mono { font-family: var(--mono-font, "JetBrains Mono", "Source Code Pro", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace); }
  </style>
  </defs>

  <!-- Canvas Backdrop -->
  <rect x="1" y="1" width="1078" height="358" rx="14" fill="var(--canvas)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="540" y="34" text-anchor="middle" fill="var(--ink)" class="mono" font-size="13" font-weight="800" letter-spacing="0.05em">SEQUENTIAL AGENT–WORLD–INSTITUTION LOOP (CommunityReserveEnv)</text>

  <!-- World & Reserve -->
  <rect x="28" y="62" width="300" height="264" rx="12" fill="var(--elevated)" stroke="var(--sky)" stroke-width="2.2"/>
  <text x="178" y="92" text-anchor="middle" fill="var(--sky)" class="mono" font-size="11.5" font-weight="800" letter-spacing="0.04em">WORLD &amp; RESERVE (S_t, R_t)</text>
  <text x="178" y="122" text-anchor="middle" fill="var(--ink)" font-size="13.5" font-weight="750">Clustered Population (c = 1..6)</text>
  <text x="178" y="152" text-anchor="middle" fill="var(--muted)" font-size="12">• Pareto tail surges (α &lt; 2)</text>
  <text x="178" y="178" text-anchor="middle" fill="var(--muted)" font-size="12">• Kingman queue ρ / (1 − ρ)</text>
  <text x="178" y="204" text-anchor="middle" fill="var(--muted)" font-size="12">• Performative feedback D(θ)</text>
  <rect x="48" y="232" width="260" height="68" rx="8" fill="var(--rose-bg)" stroke="var(--rose)" stroke-width="1.6"/>
  <text x="178" y="260" text-anchor="middle" fill="var(--rose)" class="mono" font-size="11.5" font-weight="800">ABSORBING RUIN BARRIER</text>
  <text x="178" y="282" text-anchor="middle" fill="var(--ink)" class="mono" font-size="11.5" font-weight="700">R_t ≤ 0  (TTS_survival &lt; TTR_recovery)</text>

  <!-- Filter I & II: Mutilated Archive -->
  <rect x="390" y="62" width="300" height="116" rx="12" fill="var(--elevated)" stroke="var(--amber)" stroke-width="2.2"/>
  <text x="540" y="90" text-anchor="middle" fill="var(--amber)" class="mono" font-size="11.5" font-weight="800" letter-spacing="0.04em">FILTER I &amp; II · ARCHIVE O_t</text>
  <text x="540" y="118" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="750">Selective Exclusion (ρ_{R,Y} ≠ 0)</text>
  <text x="540" y="142" text-anchor="middle" fill="var(--muted)" font-size="12">Cluster echo DEFF_var &amp; bitemporal vintages</text>
  <text x="540" y="162" text-anchor="middle" fill="var(--muted)" class="mono" font-size="11">Manski–Lee [L_t, U_t] · Keynes V(n_eff)</text>

  <!-- Agent & Institution -->
  <rect x="752" y="62" width="300" height="264" rx="12" fill="var(--elevated)" stroke="var(--emerald)" stroke-width="2.2"/>
  <text x="902" y="92" text-anchor="middle" fill="var(--emerald)" class="mono" font-size="11.5" font-weight="800" letter-spacing="0.04em">AGENT &amp; INSTITUTION (A_t)</text>
  <text x="902" y="122" text-anchor="middle" fill="var(--ink)" font-size="13.5" font-weight="750">Nuclear Triad (M_Leontief)</text>
  <text x="902" y="152" text-anchor="middle" fill="var(--muted)" font-size="12">1. Epistemic Margin [L_t, U_t], n_eff</text>
  <text x="902" y="178" text-anchor="middle" fill="var(--muted)" font-size="12">2. Vital Margin (Kingman + Kelly)</text>
  <text x="902" y="204" text-anchor="middle" fill="var(--muted)" font-size="12">3. Institutional Governance (S_gov)</text>
  <rect x="772" y="232" width="260" height="68" rx="8" fill="var(--emerald-bg)" stroke="var(--emerald)" stroke-width="1.6"/>
  <text x="902" y="260" text-anchor="middle" fill="var(--emerald)" class="mono" font-size="11.5" font-weight="800">ALGEDONIC S3* &amp; TELIC SEAL</text>
  <text x="902" y="282" text-anchor="middle" fill="var(--ink)" class="mono" font-size="11.5" font-weight="700">TemporalVault · 7 Grammar Guards</text>

  <!-- Filter III: Action & Time -->
  <rect x="390" y="210" width="300" height="116" rx="12" fill="var(--elevated)" stroke="var(--violet)" stroke-width="2.2"/>
  <text x="540" y="238" text-anchor="middle" fill="var(--violet)" class="mono" font-size="11.5" font-weight="800" letter-spacing="0.04em">FILTER III · ACTION &amp; TIME</text>
  <text x="540" y="266" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="750">Capacity C_t, Reserve B_t, Leverage f_t</text>
  <text x="540" y="290" text-anchor="middle" fill="var(--muted)" font-size="12">TTS_survival ≥ TTR_recovery</text>
  <text x="540" y="310" text-anchor="middle" fill="var(--muted)" class="mono" font-size="11">3 Reflexive Goodhart Brakes</text>

  <!-- Sequential Mediation Arrows -->
  <line x1="328" y1="120" x2="384" y2="120" stroke="var(--muted)" stroke-width="2.4" marker-end="url(#loop-arrow)"/>
  <line x1="690" y1="120" x2="746" y2="120" stroke="var(--muted)" stroke-width="2.4" marker-end="url(#loop-arrow)"/>
  <line x1="752" y1="268" x2="696" y2="268" stroke="var(--muted)" stroke-width="2.4" marker-end="url(#loop-arrow)"/>
  <line x1="390" y1="268" x2="334" y2="268" stroke="var(--muted)" stroke-width="2.4" marker-end="url(#loop-arrow)"/>
</svg>
