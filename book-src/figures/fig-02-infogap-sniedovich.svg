<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" fill="none" role="img" aria-labelledby="title-fig-02-infogap">
  <title id="title-fig-02-infogap">Info-Gap Robustness Horizon versus Sniedovich's No-Man's Land and the Global Wald Maximin Safeguard</title>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--muted)"/>
    </marker>
  <style>
    svg:root {
      color-scheme: light dark;
      --font-sans: "Inter", "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono-font: "JetBrains Mono", "Source Code Pro", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      --canvas: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --surface: #ffffff;
      --elevated: #f1f5f9;
      --border: #cbd5e1;
      --sky: #1d4ed8;
      --sky-bg: #dbeafe;
      --emerald: #047857;
      --emerald-bg: #d1fae5;
      --amber: #b45309;
      --amber-bg: #fef3c7;
      --rose: #be123c;
      --rose-bg: #ffe4e6;
    }
    @media (prefers-color-scheme: dark) {
      svg:root {
        --canvas: #0f1626;
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --surface: #0f1626;
        --elevated: #162036;
        --border: #1e2d4a;
        --sky: #38bdf8;
        --sky-bg: #0c2644;
        --emerald: #34d399;
        --emerald-bg: #092e26;
        --amber: #fbbf24;
        --amber-bg: #362407;
        --rose: #fb7185;
        --rose-bg: #3b101d;
      }
    }
    @supports (color: light-dark(white, black)) {
      svg:root {
        --canvas: light-dark(#ffffff, #0f1626);
        --ink: light-dark(#0f172a, #e2e8f0);
        --muted: light-dark(#475569, #94a3b8);
        --surface: light-dark(#ffffff, #0f1626);
        --elevated: light-dark(#f1f5f9, #162036);
        --border: light-dark(#cbd5e1, #1e2d4a);
        --sky: light-dark(#1d4ed8, #38bdf8);
        --sky-bg: light-dark(#dbeafe, #0c2644);
        --emerald: light-dark(#047857, #34d399);
        --emerald-bg: light-dark(#d1fae5, #092e26);
        --amber: light-dark(#b45309, #fbbf24);
        --amber-bg: light-dark(#fef3c7, #362407);
        --rose: light-dark(#be123c, #fb7185);
        --rose-bg: light-dark(#ffe4e6, #3b101d);
      }
    }
    text { font-family: var(--font-sans, "Inter", "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
    .mono { font-family: var(--mono-font, "JetBrains Mono", "Source Code Pro", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace); }
  </style>
  </defs>

  <!-- Canvas Backdrop -->
  <rect x="1" y="1" width="1098" height="398" rx="14" fill="var(--canvas)" stroke="var(--border)" stroke-width="1.5"/>

  <!-- Shaded No-Man's Land Region -->
  <rect x="690" y="28" width="370" height="300" rx="10" fill="var(--rose-bg)" opacity="0.58"/>
  <text x="875" y="54" text-anchor="middle" fill="var(--rose)" class="mono" font-size="11.5" font-weight="800" letter-spacing="0.03em">SNIEDOVICH'S "NO-MAN'S LAND" (α &gt; α̂<tspan dy="2.5" font-size="72%">A</tspan><tspan dy="-2.5">)</tspan></text>
  <text x="875" y="76" text-anchor="middle" fill="var(--muted)" font-size="10.5">Uninspected by Info-Gap; policed by Global Wald Floor</text>

  <!-- Axes -->
  <line x1="110" y1="336" x2="110" y2="20" stroke="var(--muted)" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <line x1="110" y1="236" x2="1068" y2="236" stroke="var(--muted)" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="98" y="34" text-anchor="end" fill="var(--ink)" font-size="12.5" font-weight="700">Reward R(q, u)</text>
  <text x="735" y="378" text-anchor="middle" fill="var(--ink)" font-size="12.5" font-weight="700">Uncertainty Horizon α →</text>

  <!-- Critical Survival Threshold r_c -->
  <line x1="110" y1="156" x2="1060" y2="156" stroke="var(--sky)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="98" y="160" text-anchor="end" fill="var(--sky)" class="mono" font-size="11.5" font-weight="700">r<tspan dy="2.5" font-size="72%">c</tspan></text>

  <!-- Global Wald Maximin Floor r_Wald -->
  <line x1="110" y1="196" x2="1060" y2="196" stroke="var(--emerald)" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="98" y="200" text-anchor="end" fill="var(--emerald)" class="mono" font-size="11.5" font-weight="700">r<tspan dy="2.5" font-size="72%">Wald</tspan></text>

  <!-- Zero & Catastrophe Labels -->
  <text x="98" y="240" text-anchor="end" fill="var(--muted)" class="mono" font-size="11.5" font-weight="600">0</text>
  <text x="98" y="320" text-anchor="end" fill="var(--rose)" class="mono" font-size="11.5" font-weight="700">R<tspan dy="2.5" font-size="72%">ruin</tspan></text>

  <!-- Vertical Markers at alpha_hat_B and alpha_hat_A (> alpha_hat_B) -->
  <line x1="410" y1="156" x2="410" y2="236" stroke="var(--emerald)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="410" y="258" text-anchor="middle" fill="var(--emerald)" class="mono" font-size="11.5" font-weight="700">α̂<tspan dy="2.5" font-size="72%">B</tspan></text>

  <line x1="690" y1="156" x2="690" y2="336" stroke="var(--rose)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="690" y="356" text-anchor="middle" fill="var(--rose)" class="mono" font-size="11.5" font-weight="700">α̂<tspan dy="2.5" font-size="72%">A</tspan><tspan dy="-2.5"> (&gt; α̂</tspan><tspan dy="2.5" font-size="72%">B</tspan><tspan dy="-2.5">)</tspan></text>

  <!-- Curve B: Robust Satisficing Option (smaller local horizon alpha_hat_B, globally >= r_Wald) -->
  <path d="M 110 128 C 210 136, 320 146, 410 156 C 560 172, 820 182, 1040 186" fill="none" stroke="var(--emerald)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="410" cy="156" r="5.5" fill="var(--surface)" stroke="var(--emerald)" stroke-width="3"/>
  <text x="128" y="178" fill="var(--emerald)" font-size="12" font-weight="800">Option B — Robust Satisficing (APPROVED)</text>
  <text x="128" y="218" fill="var(--emerald)" font-size="11.5" font-weight="700">inf<tspan dy="2.5" font-size="72%">u</tspan><tspan dy="-2.5"> R(q</tspan><tspan dy="2.5" font-size="72%">B</tspan><tspan dy="-2.5">, u) ≥ r</tspan><tspan dy="2.5" font-size="72%">Wald</tspan><tspan dy="-2.5"> across all α</tspan></text>

  <!-- Curve A: Fragile Local Optimum (wider local horizon alpha_hat_A > alpha_hat_B, collapses below r_Wald) -->
  <path d="M 110 52 C 320 62, 540 95, 690 156 C 740 198, 785 308, 845 316 L 1045 316" fill="none" stroke="var(--rose)" stroke-width="3.2" stroke-dasharray="8 5" stroke-linecap="round"/>
  <circle cx="690" cy="156" r="5.5" fill="var(--surface)" stroke="var(--rose)" stroke-width="3"/>
  <text x="128" y="46" fill="var(--rose)" font-size="12.5" font-weight="800">Option A — Fragile Local Optimum</text>
  <text x="934" y="260" text-anchor="middle" fill="var(--rose)" font-size="11.5" font-weight="800">Catastrophic Collapse to R<tspan dy="2.5" font-size="72%">ruin</tspan><tspan dy="-2.5"> ≪ 0</tspan></text>
  <text x="934" y="278" text-anchor="middle" fill="var(--rose)" font-size="11" font-weight="700">(BLOCKED by Global Wald Floor!)</text>
</svg>
