<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" fill="none" role="img" aria-labelledby="title-fig-10-vault">
  <title id="title-fig-10-vault">State Machine of the Single-Opening TemporalVault</title>
  <defs>
    <marker id="v-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--sky)"/>
    </marker>
    <marker id="v-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--emerald)"/>
    </marker>
    <marker id="v-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--amber)"/>
    </marker>
    <marker id="v-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--rose)"/>
    </marker>
  <style>
    svg:root {
      color-scheme: light dark;
      --font-sans: "Inter", "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono-font: "JetBrains Mono", "Source Code Pro", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      --canvas: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --surface: #ffffff;
      --elevated: #f1f5f9;
      --border: #cbd5e1;
      --sky: #1d4ed8;
      --sky-bg: #dbeafe;
      --violet: #e11d48;
      --violet-bg: #ffe4e6;
      --emerald: #047857;
      --emerald-bg: #d1fae5;
      --amber: #b45309;
      --amber-bg: #fef3c7;
      --rose: #be123c;
      --rose-bg: #ffe4e6;
    }
    @media (prefers-color-scheme: dark) {
      svg:root {
        --canvas: #0f1626;
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --surface: #0f1626;
        --elevated: #162036;
        --border: #1e2d4a;
        --sky: #38bdf8;
        --sky-bg: #0c2644;
        --violet: #fb7185;
        --violet-bg: #3b101d;
        --emerald: #34d399;
        --emerald-bg: #092e26;
        --amber: #fbbf24;
        --amber-bg: #362407;
        --rose: #fb7185;
        --rose-bg: #3b101d;
      }
    }
    @supports (color: light-dark(white, black)) {
      svg:root {
        --canvas: light-dark(#ffffff, #0f1626);
        --ink: light-dark(#0f172a, #e2e8f0);
        --muted: light-dark(#475569, #94a3b8);
        --surface: light-dark(#ffffff, #0f1626);
        --elevated: light-dark(#f1f5f9, #162036);
        --border: light-dark(#cbd5e1, #1e2d4a);
        --sky: light-dark(#1d4ed8, #38bdf8);
        --sky-bg: light-dark(#dbeafe, #0c2644);
        --violet: light-dark(#e11d48, #fb7185);
        --violet-bg: light-dark(#ffe4e6, #3b101d);
        --emerald: light-dark(#047857, #34d399);
        --emerald-bg: light-dark(#d1fae5, #092e26);
        --amber: light-dark(#b45309, #fbbf24);
        --amber-bg: light-dark(#fef3c7, #362407);
        --rose: light-dark(#be123c, #fb7185);
        --rose-bg: light-dark(#ffe4e6, #3b101d);
      }
    }
    text { font-family: var(--font-sans, "Inter", "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
    .mono { font-family: var(--mono-font, "JetBrains Mono", "Source Code Pro", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace); }
  </style>
  </defs>

  <!-- Canvas Backdrop -->
  <rect x="1" y="1" width="1098" height="368" rx="14" fill="var(--canvas)" stroke="var(--border)" stroke-width="1.5"/>

  <!-- State 0: SealedExAnte -->
  <rect x="250" y="18" width="540" height="70" rx="12" fill="var(--elevated)" stroke="var(--sky)" stroke-width="2.4"/>
  <text x="520" y="47" text-anchor="middle" fill="var(--ink)" class="mono" font-size="14.5" font-weight="800">SealedExAnte (unseal_attempts = 0)</text>
  <text x="520" y="70" text-anchor="middle" fill="var(--sky)" class="mono" font-size="11.5" font-weight="700">64-Hex SHA-256 + RFC 2104 Keyed HMAC-SHA256 Seal</text>

  <!-- Transition: unseal_with_key() -->
  <line x1="520" y1="88" x2="520" y2="128" stroke="var(--sky)" stroke-width="2.6" marker-end="url(#v-sky)"/>
  <text x="506" y="114" text-anchor="end" fill="var(--sky)" class="mono" font-size="12" font-weight="800">1st call: unseal_with_key()</text>

  <!-- Gate Evaluation Node -->
  <rect x="250" y="134" width="540" height="64" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="520" y="161" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="800">Verify Keyed HMAC &amp; Holdout Rule (unseal_attempts = 1)</text>
  <text x="520" y="182" text-anchor="middle" fill="var(--muted)" class="mono" font-size="11">Check Auditor Key HMAC-SHA256 &amp; Out-of-Time Holdout Target</text>

  <!-- Branch Pass vs Fail -->
  <line x1="395" y1="198" x2="276" y2="248" stroke="var(--emerald)" stroke-width="2.4" marker-end="url(#v-emerald)"/>
  <text x="315" y="224" text-anchor="end" fill="var(--emerald)" class="mono" font-size="11.5" font-weight="800">Key OK &amp; Score ≤ Target</text>

  <line x1="645" y1="198" x2="804" y2="248" stroke="var(--amber)" stroke-width="2.4" marker-end="url(#v-amber)"/>
  <text x="745" y="224" text-anchor="start" fill="var(--amber)" class="mono" font-size="11.5" font-weight="800">Score &gt; Target / Bad Key</text>

  <!-- Terminal State 1: OpenedConfirmatory -->
  <rect x="36" y="254" width="480" height="94" rx="12" fill="var(--emerald-bg)" stroke="var(--emerald)" stroke-width="2.4"/>
  <text x="276" y="285" text-anchor="middle" fill="var(--ink)" class="mono" font-size="14.5" font-weight="800">OpenedConfirmatory</text>
  <text x="276" y="309" text-anchor="middle" fill="var(--emerald)" class="mono" font-size="11.5" font-weight="700">Status: Confirmatory Pre-Registered OK</text>
  <text x="276" y="331" text-anchor="middle" fill="var(--muted)" font-size="11.5">Holdout generalization &amp; auditor HMAC verified</text>

  <!-- Terminal State 2: PostCommitmentDeviation -->
  <rect x="564" y="254" width="480" height="94" rx="12" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.4"/>
  <text x="804" y="285" text-anchor="middle" fill="var(--ink)" class="mono" font-size="14.5" font-weight="800">PostCommitmentDeviation</text>
  <text x="804" y="309" text-anchor="middle" fill="var(--amber)" class="mono" font-size="11.5" font-weight="700">Status: Downgraded to Exploratory / Tampered</text>
  <text x="804" y="331" text-anchor="middle" fill="var(--muted)" font-size="11.5">Requires brand-new untouched future vault</text>

  <!-- Blocked 2nd Call Callout -->
  <rect x="820" y="102" width="256" height="68" rx="10" fill="var(--rose-bg)" stroke="var(--rose)" stroke-width="2"/>
  <text x="948" y="130" text-anchor="middle" fill="var(--rose)" class="mono" font-size="11.5" font-weight="800">ANY 2ND unseal_with_key()</text>
  <text x="948" y="152" text-anchor="middle" fill="var(--ink)" class="mono" font-size="11" font-weight="700">PostCommitmentDeviation (Brake 2)</text>
  <line x1="790" y1="154" x2="814" y2="142" stroke="var(--rose)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#v-rose)"/>
</svg>
