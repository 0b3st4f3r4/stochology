<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="auto" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Pure-Rust Two-Crate Workspace (Zero External Dependencies)</text>

  <rect x="40" y="64" width="380" height="145" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">crates/stochology (Library Crate)</text>
  <text x="230" y="116" text-anchor="middle" font-size="12" fill="#1e40af">• rng, sha256, math — SplitMix64, FIPS 180-4, Cholesky &amp; PAV</text>
  <text x="230" y="138" text-anchor="middle" font-size="12" fill="#1e40af">• engine — CommunityReserveEnv, NaiveOptimizer, StochologicalAgent</text>
  <text x="230" y="160" text-anchor="middle" font-size="12" fill="#1e40af">• inquiry, identification, asymmetry, archive, performativity, vital</text>
  <text x="230" y="182" text-anchor="middle" font-size="12" fill="#1e40af">• governance, synthesis — Nuclear Triad, Process Tracing &amp; Brakes</text>

  <rect x="470" y="64" width="250" height="145" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">crates/stochology-cli (Binary)</text>
  <text x="595" y="118" text-anchor="middle" font-size="12" fill="#166534">• csv &amp; loaders (14 sealed CSVs)</text>
  <text x="595" y="142" text-anchor="middle" font-size="12" fill="#166534">• SHA-256 manifest verification</text>
  <text x="595" y="166" text-anchor="middle" font-size="12" fill="#166534">• Chapters 1–9 laboratories</text>
  <text x="595" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">• Binary: `stochology`</text>

  <line x1="470" y1="136" x2="424" y2="136" stroke="#475569" stroke-width="2"/>
  <polygon points="420,136 429,131 429,141" fill="#475569"/>
