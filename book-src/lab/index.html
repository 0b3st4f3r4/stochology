    (function () {
      var VALID = ["light", "rust", "navy", "coal", "ayu"];
      function resolveMainTheme() {
        var stored = null;
        try {
          stored = localStorage.getItem("mdbook-theme");
          if (stored && stored.charAt(0) === '"' && stored.charAt(stored.length - 1) === '"') {
            stored = stored.slice(1, -1);
          }
        } catch (e) {}
        if (stored && VALID.indexOf(stored) !== -1) {
          return stored;
        }
        try {
          var host = (window.parent && window.parent !== window) ? window.parent : window.opener;
          if (host && host.document && host.document.documentElement) {
            var hostCl = host.document.documentElement.classList;
            for (var h = 0; h < VALID.length; h++) {
              if (hostCl.contains(VALID[h])) return VALID[h];
            }
          }
        } catch (e) {}
        var params = new URLSearchParams(window.location.search);
        var qTheme = params.get("theme");
        if (qTheme === "dark") return "navy";
        if (qTheme && VALID.indexOf(qTheme) !== -1) return qTheme;
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          return "navy";
        }
        return "light";
      }
      var theme = resolveMainTheme();
      var root = document.documentElement;
      for (var i = 0; i < VALID.length; i++) {
        root.classList.remove(VALID[i]);
      }
      root.classList.add(theme);
      root.classList.add("js");
    })();
  </script>

      var chapLinksEl = document.getElementById("lab-chapter-links");
      var searchInput = document.getElementById("lab-search-input");
      var searchClear = document.getElementById("lab-search-clear");
      var visibleCountEl = document.getElementById("lab-visible-count");
      var emptyStateEl = document.getElementById("lab-empty-state");
      var prevBtn = document.getElementById("lab-prev-btn");
      var nextBtn = document.getElementById("lab-next-btn");
      var mobileDrawerBtn = document.getElementById("lab-mobile-drawer-btn");
      var mobileActiveLabel = document.getElementById("lab-mobile-active-label");
      var sidebarEl = document.getElementById("lab-sidebar");

      var activeModuleId = "gigerenzer-bayes";
      var activePillar = "ALL";
      var registry = window.STOCHOLOGY_LAB_REGISTRY || {};

      function resolveMainTheme() {
        var stored = null;
        try {
          stored = localStorage.getItem("mdbook-theme");
          if (stored && stored.charAt(0) === '"' && stored.charAt(stored.length - 1) === '"') {
            stored = stored.slice(1, -1);
          }
        } catch (e) {}
        if (stored && VALID_THEMES.indexOf(stored) !== -1) {
          return stored;
        }
        try {
          var host = (window.parent && window.parent !== window) ? window.parent : window.opener;
          if (host && host.document && host.document.documentElement) {
            var hostCl = host.document.documentElement.classList;
            for (var h = 0; h < VALID_THEMES.length; h++) {
              if (hostCl.contains(VALID_THEMES[h])) return VALID_THEMES[h];
            }
          }
        } catch (e) {}
        var params = new URLSearchParams(window.location.search);
        var qTheme = params.get("theme");
        if (qTheme === "dark") return "navy";
        if (qTheme && VALID_THEMES.indexOf(qTheme) !== -1) return qTheme;
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          return "navy";
        }
        return "light";
      }

      function applyTheme(theme) {
        if (VALID_THEMES.indexOf(theme) === -1) theme = "light";
        var root = document.documentElement;
        for (var i = 0; i < VALID_THEMES.length; i++) {
          root.classList.remove(VALID_THEMES[i]);
        }
        root.classList.add(theme);
        root.classList.add("js");
        var frames = document.querySelectorAll(".stoch-lab-iframe");
        for (var f = 0; f < frames.length; f++) {
          if (frames[f].contentWindow) {
            try {
              frames[f].contentWindow.postMessage(
                { type: "stochology:theme", theme: theme, dark: !!DARK_THEMES[theme] },
                "*"
              );
            } catch (err) {}
          }
        }
      }

      function syncThemeFromMainPage() {
        applyTheme(resolveMainTheme());
      }

      syncThemeFromMainPage();

      window.addEventListener("storage", function (e) {
        if (!e || !e.key || e.key === "mdbook-theme") {
          syncThemeFromMainPage();
        }
      });

      window.addEventListener("focus", syncThemeFromMainPage);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          syncThemeFromMainPage();
        }
      });

      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        if (mq.addEventListener) {
          mq.addEventListener("change", syncThemeFromMainPage);
        }
      }

      try {
        var hostWin = (window.parent && window.parent !== window) ? window.parent : window.opener;
        if (hostWin && hostWin.document && hostWin.document.documentElement && typeof MutationObserver !== "undefined") {
          var hostObs = new MutationObserver(syncThemeFromMainPage);
          hostObs.observe(hostWin.document.documentElement, {
            attributes: true,
            attributeFilter: ["class"]
          });
        }
      } catch (e) {}

      mobileDrawerBtn.addEventListener("click", function () {
        var isOpen = sidebarEl.classList.toggle("is-open");
        mobileDrawerBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
        mobileDrawerBtn.textContent = isOpen ? "Hide Modules (16) ▴" : "Browse Modules (16) ▾";
      });

      function renderChapterLinks(mod, preferredChapter) {
        var spec = registry[mod.id] || {};
        var chapters = mod.chapters || spec.chapters || [{ slug: mod.chapter, label: "Read Chapter" }];
        var normPref = (preferredChapter || "").trim();
        if (normPref && !/\.html$/i.test(normPref)) {
          normPref = normPref + ".html";
        }
        var hasMatch = false;
        for (var m = 0; m < chapters.length; m++) {
          if (chapters[m].slug === normPref) {
            hasMatch = true;
            break;
          }
        }
        chapLinksEl.innerHTML = '<span class="lab-chapter-links-label">Textbook:</span>';
        for (var c = 0; c < chapters.length; c++) {
          var ch = chapters[c];
          var isPrimary = hasMatch ? normPref === ch.slug : c === 0;
          var a = document.createElement("a");
          a.href = "../" + ch.slug;
          a.className = "stoch-lab-btn" + (isPrimary ? " stoch-lab-btn-primary" : "");
          a.textContent = ch.label + " →";
          chapLinksEl.appendChild(a);
        }
      }

      function resolveModuleId(rawId) {
        if (!rawId) return "gigerenzer-bayes";
        var trimmed = String(rawId).trim();
        for (var i = 0; i < MODULES.length; i++) {
          if (MODULES[i].id === trimmed) return MODULES[i].id;
        }
        var upper = trimmed.toUpperCase();
        for (var k in registry) {
          if (Object.prototype.hasOwnProperty.call(registry, k)) {
            if (registry[k] && String(registry[k].code || "").toUpperCase() === upper) {
              return k;
            }
          }
        }
        return "gigerenzer-bayes";
      }

      function selectModule(modId, preserveQuery) {
        var resolvedId = resolveModuleId(modId);
        var idx = 0;
        for (var i = 0; i < MODULES.length; i++) {
          if (MODULES[i].id === resolvedId) {
            idx = i;
            break;
          }
        }
        var found = MODULES[idx];
        activeModuleId = found.id;

        var buttons = listEl.querySelectorAll(".lab-nav-item");
        for (var b = 0; b < buttons.length; b++) {
          var isMatch = buttons[b].getAttribute("data-id") === found.id;
          buttons[b].classList.toggle("active", isMatch);
          if (isMatch) {
            buttons[b].setAttribute("aria-current", "true");
          } else {
            buttons[b].removeAttribute("aria-current");
          }
        }

        var q = parseQuery();
        var activeSeed = parseInt(q.seed, 10);
        if (!isFinite(activeSeed) || activeSeed <= 0) activeSeed = 2026;

        var spec = registry[found.id] || {};
        idEl.textContent = "(" + (idx + 1) + "/16) · " + found.id + " · Φ₁ (seed = " + activeSeed + ")";
        var topbarTitle = document.getElementById("lab-topbar-title");
        if (topbarTitle) {
          topbarTitle.textContent = "Stochology Interactive Laboratory (seed = " + activeSeed + ")";
        }
        mobileActiveLabel.textContent = found.label;
        if (spec.title) {
          document.title = spec.title + " | Stochology /lab (seed = " + activeSeed + ")";
        }

        renderChapterLinks(found, q.chapter);

        if (!preserveQuery && window.history && window.history.replaceState) {
          window.history.replaceState(null, "", "?module=" + encodeURIComponent(found.id) + "&seed=" + activeSeed);
        }

        hostEl.innerHTML = "";
        var widget = document.createElement("div");
        widget.className = "stoch-lab";
        widget.setAttribute("data-lab", found.id);
        widget.setAttribute("data-seed", String(activeSeed));
        if (preserveQuery) {
          widget.setAttribute("data-from-query", "true");
        }
        hostEl.appendChild(widget);

        if (window.hydrateStochologyLabWidget) {
          window.hydrateStochologyLabWidget(widget);
        }

        if (sidebarEl.classList.contains("is-open")) {
          sidebarEl.classList.remove("is-open");
          mobileDrawerBtn.setAttribute("aria-expanded", "false");
          mobileDrawerBtn.textContent = "Browse Modules (16) ▾";
        }
      }

      function applyFilters() {
        var term = (searchInput.value || "").trim().toLowerCase();
        searchClear.classList.toggle("visible", term.length > 0);
        var items = listEl.querySelectorAll("li");
        var visible = 0;
        for (var i = 0; i < items.length; i++) {
          var li = items[i];
          var btn = li.querySelector(".lab-nav-item");
          var p = btn.getAttribute("data-pillar");
          var haystack = btn.getAttribute("data-search") || "";
          var pillarOk = activePillar === "ALL" || p === activePillar;
          var termOk = !term || haystack.indexOf(term) !== -1;
          var show = pillarOk && termOk;
          li.style.display = show ? "" : "none";
          if (show) visible++;
        }
        visibleCountEl.textContent = visible + " / " + MODULES.length;
        emptyStateEl.style.display = visible === 0 ? "block" : "none";
      }

      for (var m = 0; m < MODULES.length; m++) {
        (function (item) {
          var spec = registry[item.id] || {};
          var pillarCode = item.pillar || "C";
          var chapList = item.chapters || spec.chapters || [];
          var chapText = chapList.map(function (c) { return c.label; }).join(" · ");
          var searchBlob = [
            item.id,
            item.label,
            spec.title || "",
            spec.subtitle || "",
            spec.pillar || "",
            chapText
          ].join(" ").toLowerCase();

          var li = document.createElement("li");
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "lab-nav-item";
          btn.setAttribute("data-id", item.id);
          btn.setAttribute("data-pillar", pillarCode);
          btn.setAttribute("data-search", searchBlob);
          btn.innerHTML =
            '<span class="lab-nav-item-top">' +
              "<span>" + item.label + "</span>" +
              '<span class="lab-nav-pillar">' + ( pillarCode === "A-Audit" ? "A·Audit" : pillarCode ) + "</span>" +
            "</span>" +
            '<span class="lab-nav-sub">' + item.id + (chapText ? " · " + chapText : "") + "</span>";
          btn.addEventListener("click", function () {
            selectModule(item.id, false);
          });
          li.appendChild(btn);
          listEl.appendChild(li);
        })(MODULES[m]);
      }

      searchInput.addEventListener("input", applyFilters);
      searchClear.addEventListener("click", function () {
        searchInput.value = "";
        applyFilters();
        searchInput.focus();
      });

      var pillarPills = document.querySelectorAll(".lab-pillar-pill");
      for (var p = 0; p < pillarPills.length; p++) {
        (function (pill) {
          pill.addEventListener("click", function () {
            activePillar = pill.getAttribute("data-pillar") || "ALL";
            for (var k = 0; k < pillarPills.length; k++) {
              pillarPills[k].setAttribute("aria-pressed", pillarPills[k] === pill ? "true" : "false");
            }
            applyFilters();
          });
        })(pillarPills[p]);
      }

      function stepModule(delta) {
        var visibleIds = [];
        var items = listEl.querySelectorAll("li");
        for (var j = 0; j < items.length; j++) {
          if (items[j].style.display !== "none") {
            var btn = items[j].querySelector(".lab-nav-item");
            if (btn && btn.getAttribute("data-id")) {
              visibleIds.push(btn.getAttribute("data-id"));
            }
          }
        }
        var pool = visibleIds.length > 0 ? visibleIds : MODULES.map(function (m) { return m.id; });
        var curIdx = 0;
        for (var i = 0; i < pool.length; i++) {
          if (pool[i] === activeModuleId) {
            curIdx = i;
            break;
          }
        }
        var nextIdx = (curIdx + delta + pool.length) % pool.length;
        selectModule(pool[nextIdx], false);
      }

      prevBtn.addEventListener("click", function () { stepModule(-1); });
      nextBtn.addEventListener("click", function () { stepModule(1); });

      document.addEventListener("keydown", function (ev) {
        var tag = ev.target && ev.target.tagName ? ev.target.tagName.toLowerCase() : "";
        var inInput = tag === "input" || tag === "textarea" || tag === "select" || (ev.target && ev.target.isContentEditable);
        if (ev.key === "/" && !inInput && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
          ev.preventDefault();
          searchInput.focus();
        } else if (ev.key === "[" && !inInput && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
          ev.preventDefault();
          stepModule(-1);
        } else if (ev.key === "]" && !inInput && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
          ev.preventDefault();
          stepModule(1);
        }
      });

      var initialQ = parseQuery();
      selectModule(initialQ.module || initialQ.lab || "gigerenzer-bayes", true);
    })();
  </script>
</body>
</html>
