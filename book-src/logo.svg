<svg xmlns="http://www.w3.org/2000/svg" width="660" height="132" viewBox="0 0 660 132" fill="none" role="img" aria-labelledby="stochology-logo-title">
  <title id="stochology-logo-title">Stochology — The Science and Ethics of Aim Under Uncertainty</title>
  <defs>
    <!-- Progression aligned with the disc: L1 (Green) -> L2 (Blue) -> (p*, r_c) Crosshair (Gold) -> L3 (Crimson) -->
    <linearGradient id="logo-ring" x1="2" y1="103" x2="468" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--logo-green, #10b981)"/>
      <stop offset="38%" stop-color="var(--logo-blue, #2563eb)"/>
      <stop offset="66%" stop-color="var(--logo-gold, #f59e0b)"/>
      <stop offset="100%" stop-color="var(--logo-crimson, #e11d48)"/>
    </linearGradient>
    <linearGradient id="logo-sky-sclera" x1="29" y1="50" x2="97" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.92"/>
      <stop offset="36%" stop-color="#1e3a8a" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#78350f" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="logo-tail" x1="29" y1="81" x2="96" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--logo-green, #10b981)" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="var(--logo-blue, #2563eb)" stop-opacity="0.50"/>
      <stop offset="75%" stop-color="var(--logo-gold, #f59e0b)" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="var(--logo-crimson, #e11d48)" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="logo-glow" cx="53%" cy="51%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="78%" stop-color="#e11d48" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090e1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logo-eclipse-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="1"/>
      <stop offset="38%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="62%" stop-color="#d97706" stop-opacity="0.88"/>
      <stop offset="84%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.75"/>
    </radialGradient>
    <clipPath id="logo-surreal-eye-aperture">
      <path d="M 29 68.5 C 37 66, 44 45, 56 46 C 68 47, 78 60, 97 67.5 C 83 80.5, 66 84, 50 81.5 C 39 79.5, 33 74, 29 68.5 Z"/>
    </clipPath>
    <style>
      :root:not(.light):not(.rust):not(.navy):not(.coal):not(.ayu) {
        color-scheme: light dark;
        --logo-ink: #0f172a;
        --logo-sub: #1d4ed8;
        --logo-meta: #475569;
        --logo-frame: #cbd5e1;
        --logo-ticks: #64748b;
        --logo-node-bg: #f8fafc;
        --logo-blue: #2563eb;
        --logo-green: #10b981;
        --logo-crimson: #e11d48;
        --logo-gold: #f59e0b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light):not(.rust):not(.navy):not(.coal):not(.ayu) {
          --logo-ink: #f8fafc;
          --logo-sub: #38bdf8;
          --logo-meta: #94a3b8;
          --logo-frame: #1e293b;
          --logo-ticks: #64748b;
          --logo-node-bg: #090e1a;
          --logo-blue: #38bdf8;
          --logo-green: #34d399;
          --logo-crimson: #fb7185;
          --logo-gold: #fbbf24;
        }
      }
      @supports (color: light-dark(white, black)) {
        :root:not(.light):not(.rust):not(.navy):not(.coal):not(.ayu) {
          --logo-ink: light-dark(#0f172a, #f8fafc);
          --logo-sub: light-dark(#1d4ed8, #38bdf8);
          --logo-meta: light-dark(#475569, #94a3b8);
          --logo-frame: light-dark(#cbd5e1, #1e293b);
          --logo-ticks: #64748b;
          --logo-node-bg: light-dark(#f8fafc, #090e1a);
          --logo-blue: light-dark(#2563eb, #38bdf8);
          --logo-green: light-dark(#10b981, #34d399);
          --logo-crimson: light-dark(#e11d48, #fb7185);
          --logo-gold: light-dark(#f59e0b, #fbbf24);
        }
      }
    </style>
  </defs>

  <!-- Emblem Mark: Surrealist Olho-Astrolábio (Magritte / Max Ernst) -->
  <g>
    <circle cx="64" cy="66" r="52" fill="url(#logo-glow)"/>
    <circle cx="64" cy="66" r="46.5" stroke="var(--logo-ticks, #64748b)" stroke-width="0.7" stroke-dasharray="1 3.2" opacity="0.5"/>
    <circle cx="64" cy="66" r="36.5" stroke="var(--logo-gold, #f59e0b)" stroke-width="0.9" stroke-dasharray="2 4" opacity="0.55"/>

    <polygon points="64,24 100.37,87 27.63,87" stroke="var(--logo-ticks, #64748b)" stroke-width="2.2" stroke-dasharray="3.5 3.5" stroke-linejoin="round" opacity="0.72"/>
    <polygon points="64,28.5 96.4,84.7 31.6,84.7" stroke="var(--logo-gold, #f59e0b)" stroke-width="0.8" opacity="0.38"/>

    <!-- Exact 120-deg tangent-aligned cyclic bridges -->
    <path d="M 22.74 73.87 A 42 42 0 0 1 49.91 26.43" stroke="var(--logo-green, #10b981)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 46.56 33.07 L 50.88 26.10 L 43.27 23.06" stroke="var(--logo-green, #10b981)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 77.81 26.34 A 42 42 0 0 1 105.31 73.58" stroke="var(--logo-blue, #2563eb)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 101.24 67.36 L 105.11 74.59 L 111.56 69.52" stroke="var(--logo-blue, #2563eb)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 91.44 97.79 A 42 42 0 0 1 36.78 97.98" stroke="var(--logo-crimson, #e11d48)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 44.20 97.57 L 36.01 97.31 L 37.18 105.43" stroke="var(--logo-crimson, #e11d48)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

    <g clip-path="url(#logo-surreal-eye-aperture)">
      <rect x="26" y="42" width="74" height="46" fill="url(#logo-sky-sclera)"/>
      <path d="M 28 61 C 38 56, 47 56, 56 60 C 66 64, 80 63, 98 58" stroke="#f8fafc" stroke-width="1.1" opacity="0.28"/>
      <path d="M 28 71 C 43 65, 55 49, 67 64 C 76 75, 86 72, 98 69 L 98 88 L 28 88 Z" fill="url(#logo-tail)"/>
      <line x1="32" y1="65.5" x2="50.5" y2="65.5" stroke="var(--logo-gold, #f59e0b)" stroke-width="2.5" stroke-dasharray="3.2 2.8" stroke-linecap="round" opacity="0.92"/>
      <line x1="83.5" y1="65.5" x2="94" y2="65.5" stroke="var(--logo-gold, #f59e0b)" stroke-width="2.5" stroke-dasharray="3.2 2.8" stroke-linecap="round" opacity="0.92"/>
      <circle cx="67" cy="65.5" r="15.0" fill="url(#logo-eclipse-iris)" stroke="var(--logo-gold, #f59e0b)" stroke-width="1.7"/>
      <circle cx="67" cy="65.5" r="12.0" stroke="#fde047" stroke-width="0.85" stroke-dasharray="1.8 2.2" opacity="0.85"/>
      <g stroke="#fde047" stroke-width="1.1" stroke-linecap="round" opacity="0.78">
        <line x1="56.4" y1="54.9" x2="60.3" y2="58.8"/>
        <line x1="77.6" y1="54.9" x2="73.7" y2="58.8"/>
        <line x1="56.4" y1="76.1" x2="60.3" y2="72.2"/>
        <line x1="77.6" y1="76.1" x2="73.7" y2="72.2"/>
        <line x1="53.1" y1="59.8" x2="57.6" y2="61.6"/>
        <line x1="80.9" y1="59.8" x2="76.4" y2="61.6"/>
        <line x1="53.1" y1="71.2" x2="57.6" y2="69.4"/>
        <line x1="80.9" y1="71.2" x2="76.4" y2="69.4"/>
        <line x1="61.3" y1="51.6" x2="63.1" y2="56.1"/>
        <line x1="72.7" y1="51.6" x2="70.9" y2="56.1"/>
        <line x1="61.3" y1="79.4" x2="63.1" y2="74.9"/>
        <line x1="72.7" y1="79.4" x2="70.9" y2="74.9"/>
      </g>
    </g>

    <path d="M 31 63.5 C 38 60.5, 44 40.5, 55.5 41.5 C 67 42.5, 77 55.5, 95 62.5" stroke="var(--logo-ink)" stroke-width="1.25" stroke-linecap="round" opacity="0.55"/>
    <path d="M 29 68.5 C 33 74, 39 79.5, 50 81.5 C 66 84, 83 80.5, 97 67.5" stroke="var(--logo-ink)" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M 29 68.5 C 37 66, 44 45, 56 46 C 68 47, 78 60, 97 67.5" stroke="var(--logo-ink)" stroke-width="2.9" stroke-linecap="round"/>

    <line x1="67" y1="38.5" x2="67" y2="49" stroke="var(--logo-gold, #f59e0b)" stroke-width="2.6" stroke-dasharray="3.5 3.5" stroke-linecap="round"/>
    <line x1="67" y1="82.5" x2="67" y2="90.5" stroke="var(--logo-gold, #f59e0b)" stroke-width="2.6" stroke-dasharray="3.5 3.5" stroke-linecap="round"/>
    <path d="M 67 93.8 C 65.2 96.5, 64.8 98.5, 67 99.9 C 69.2 98.5, 68.8 96.5, 67 93.8 Z" fill="var(--logo-gold, #f59e0b)"/>

    <g id="golden-reticle">
      <circle cx="67" cy="65.5" r="7.4" fill="#050811" stroke="var(--logo-gold, #f59e0b)" stroke-width="2.4"/>
      <circle cx="67" cy="65.5" r="4.4" stroke="#fde047" stroke-width="0.95" opacity="0.72"/>
      <line x1="55.0" y1="65.5" x2="62.0" y2="65.5" stroke="var(--logo-gold, #f59e0b)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="72.0" y1="65.5" x2="79.0" y2="65.5" stroke="var(--logo-gold, #f59e0b)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="67" y1="53.5" x2="67" y2="60.5" stroke="var(--logo-gold, #f59e0b)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="67" y1="70.5" x2="67" y2="77.5" stroke="var(--logo-gold, #f59e0b)" stroke-width="2.4" stroke-linecap="round"/>
      <polygon points="67,62.5 68.3,64.2 70.0,65.5 68.3,66.8 67,68.5 65.7,66.8 64.0,65.5 65.7,64.2" fill="#fde047"/>
      <circle cx="64.0" cy="62.5" r="1.2" fill="#ffffff" opacity="0.92"/>
    </g>

    <circle cx="64" cy="24" r="9.2" fill="var(--logo-node-bg)" stroke="var(--logo-blue, #2563eb)" stroke-width="3.4"/>
    <circle cx="64" cy="24" r="5.0" fill="var(--logo-blue, #2563eb)"/>
    <circle cx="65.7" cy="22.4" r="3.2" fill="var(--logo-node-bg)"/>
    <circle cx="62.3" cy="25.3" r="1.25" fill="#fde047"/>
    <circle cx="27.63" cy="87" r="9.2" fill="var(--logo-node-bg)" stroke="var(--logo-green, #10b981)" stroke-width="3.4"/>
    <circle cx="27.63" cy="87" r="5.0" fill="var(--logo-green, #10b981)"/>
    <circle cx="29.33" cy="85.4" r="3.2" fill="var(--logo-node-bg)"/>
    <circle cx="25.93" cy="88.3" r="1.25" fill="#fde047"/>
    <circle cx="100.37" cy="87" r="9.2" fill="var(--logo-node-bg)" stroke="var(--logo-crimson, #e11d48)" stroke-width="3.4"/>
    <circle cx="100.37" cy="87" r="5.0" fill="var(--logo-crimson, #e11d48)"/>
    <circle cx="102.07" cy="85.4" r="3.2" fill="var(--logo-node-bg)"/>
    <circle cx="98.67" cy="88.3" r="1.25" fill="#fde047"/>
  </g>

  <!-- Wordmark & Epistemological Subtitle -->
  <g transform="translate(148, 0)">
    <text x="0" y="62" fill="var(--logo-ink)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="2.5">STOCHOLOGY</text>
    <line x1="2" y1="90" x2="468" y2="90" stroke="url(#logo-ring)" stroke-width="1.5" stroke-opacity="0.75"/>
    <text x="2" y="103" fill="var(--logo-meta)" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">L₁ → L₂ → L₃ → L₁  |  Φ₁–Φ₅  |  G1–G8  |  SIGA</text>
  </g>
</svg>

