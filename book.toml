[book]
title = "Stochology"
authors = ["Silvano Neto"]
language = "en"
src = "book-src"

[build]
build-dir = "book"
create-missing = false

[output.html]
no-section-label = true
hash-files = false
cname = "stochology.org"
site-url = "https://stochology.org/"
git-repository-url = "https://github.com/0b3st4f3r4/stochology"
edit-url-template = "https://github.com/0b3st4f3r4/stochology/edit/main/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/book.css"]
additional-js = ["mathjax.js"]

[output.html.search]
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2

[output.html.fold]
enable = true
level = 2

# Redirects from earlier editions (10-chapter and renumbered editions) to the current 86-chapter textbook.
[output.html.redirect]
"/01-layers-six-pairs.html" = "42-sequential-loop-naive-agent.html"
