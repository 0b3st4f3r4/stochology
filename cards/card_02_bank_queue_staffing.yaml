  unit_and_margin:
    independent_unit: "call center operational day (cluster of 5-minute windows)"
    nominal_sample_size_n: 27716
    weighted_cluster_mean_m_tilde: "m_tilde = m_bar * (1 + CV^2) = 169.00 * 1.000 = 169.00 (Moulton-Campbell, CV = 0.000)"
