      wasserstein_sensitivity_epsilon: 0.02
      rrm_convergence_condition: "eps * beta / gamma = 0.02 * 1.10 / 1.00 = 0.022 < 1 (strict contraction)"
      stability_optimality_divergence: "theta_PS = 1.0204 vs Stackelberg theta_PO = 1.0208 (passive-regime baseline)"
  causal_ladder:
