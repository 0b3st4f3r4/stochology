  altered_action: "Allocate 26 agents to the daily peak shift instead of the aggregate average of 20"
  question: "Does the probability of 5-minute call volume exceedance above the 90th-percentile congestion barrier (286 calls) on the operational day exceed the cost-loss threshold p* = 0.08000?"

