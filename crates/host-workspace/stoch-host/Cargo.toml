[package]
name = "stoch-host"
version = "0.1.0"
edition = "2021"
license = "CC-BY-4.0"
publish = false
description = "Host governance, FROST threshold crypto, OCap firewall, HSM seam, solar watchdog, and deterministic AOT precompiler"

[dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
frost-ed25519 = "2"
rand = "0.8"
rand_chacha = "0.3"
stoch-core = { path = "../../stoch-core" }
stoch-crdt = { path = "../../stoch-crdt" }
stoch-custody = { path = "../stoch-custody" }
stoch-math = { path = "../../stoch-math" }
wasmtime = { version = "29", default-features = false, features = ["cranelift", "parallel-compilation", "all-arch"] }
zeroize = { version = "1", features = ["derive"] }
