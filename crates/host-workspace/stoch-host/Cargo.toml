[package]
name = "stoch-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Host governance, FROST threshold crypto, OCap firewall, HSM seam, and solar watchdog"

[features]
default = []
simulated-hsm-ffi = []

[dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
frost-ed25519 = "2"
rand = "0.8"
rand_chacha = "0.3"
stoch-core = { path = "../../stoch-core" }
stoch-custody = { path = "../stoch-custody" }
stoch-math = { path = "../../stoch-math" }
zeroize = { version = "1", features = ["derive"] }
