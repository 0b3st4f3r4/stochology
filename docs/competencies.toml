# Competency DAG of the Stochology course (authorial pedagogical frame over the book, like docs/SYLLABUS.md).
#
# Each [node.<id>] is one competency, stated as what the reader can do, with the chapters that teach it,
# its prerequisites (edges of an acyclic graph), its pair or layer, its depth (core | full), a positive
# evidence command, and at most one negative proof (`gates -- --defect <name>`, expected exit 1).
# Edges follow the chapters' own cross-references where they exist and the syllabus order elsewhere;
# they must form a transitive reduction and never point forward in the book.
#
# A pathway is the prerequisite closure of the node that carries a negative proof: one pathway per proof
# (`DEFECT_COUNT` in crates/stochology-cli/src/defects.rs).
# There are no reader-role tracks: a reader picks the pathways of the proofs they need. [practicum.thread]
# lists the cross-cutting competencies of Part VII that run across every pathway.
# Rendered blocks in book-src/00-preface.md and docs/SYLLABUS.md are generated from this file;
# regenerate them with `cargo test -p stochology-cli --test competency_dag -- --ignored`.

