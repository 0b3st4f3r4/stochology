# Shaped application of the CAPIBA Protocol (worked example, simulated data, seed 31).
# The protocol_profile section is the "clay": pre-registered, Assumed parameters that calibrate
# the kernel's principles to this application. It is sealed into preregistration_hash.
id: "night_shift_ward_overflow_float_nurse"
layer: "L2"
uncertainty: "epistemic_parameter"

decision_maker_question:
  who_decides: "Coordenação de Enfermagem do Plantão Noturno"
  altered_action: "Convocar um enfermeiro volante para a enfermaria no plantão noturno quando a probabilidade calibrada de superlotação exceder p*"
  question: "A probabilidade calibrada de superlotação da enfermaria neste plantão noturno excede o limiar custo-perda p* = 0.20000?"

epistemological_header:
  generating_process: "Simulated logistic overflow process with ward random effects u_w ~ N(0, 0.8^2) and per-shift admission pressure z ~ N(0, 1) (SplitMix64, seed 31)"
  nonlinearity: "f(E[X])=0.17, E[f(X)]=10.47, Jensen gap Delta_J=+10.30, median=5.27, q05=0.03, q95=39.23, CRPS=6.63"
  unit_and_margin:
    independent_unit: "enfermaria ao longo dos plantões noturnos de 12h (cluster of night shifts per ward)"
    nominal_sample_size_n: 2410
    weighted_cluster_mean_m_tilde: "m_tilde = m_bar * (1 + CV^2) = 50.21 * 1.095 = 54.99 (Moulton-Campbell, CV = 0.309)"
    threshold_exceedance_icc: "rho_I(0.90) = 0.1979 -> DEFF_exceedance = 11.69"
    effective_sample_size_n_eff: 206
    unit_margin_of_error: "+/- 5.8 percentage points over 206 effective exceedance-adjusted ward-nights (48 wards)"
  noise_physics:
    stochastic_regime: "Bernoulli overflow with logistic link and between-ward heterogeneity (simulated)"
    absorbing_states: "Bed-block cascade: patients diverted to the emergency corridor once ward occupancy exceeds staffed capacity"
    bridge_L3_L1_performativity:
      agent_type: "performative"
      wasserstein_sensitivity_epsilon: 0.15
      rrm_convergence_condition: "eps * beta / gamma = 0.15 * 1.20 / 1.00 = 0.18 < 1 (strict contraction)"
      stability_optimality_divergence: "theta_PS = 0.212 vs Stackelberg theta_PO = 0.205 (calling float nurses lowers the overflow it forecasts)"
  causal_ladder:
    pearl_rung: "2-Act"
    identification_strategy: "Simulated intervention on float-nurse allocation; Markov blanket of overflow mapped (ward risk, admission pressure) without collider conditioning"
    untestable_assumption: "No unobserved hospital-wide surge shifting admission pressure and staffing at once (Lambda* <= 1.25)"

uncertainty_budget_and_authorship:
  variance_budget:
    inputs: 0.50
    parameters: 0.30
    covariance: 0.20
    structural_discrepancy_gp: "Gaussian Process delta(x) ~ GP(0, k_anchored(x,x')) for ward-level logit discrepancy per Kennedy-O'Hagan"
  dominant_event:
    description: "Ward overflow on a 12h night shift (occupancy above staffed capacity)"
    probability_p: 0.23112
    base_rate_floor_epsilon: 0.001
    cost_share: 0.85
  info_gap_robustness:
    critical_requirement_rc: "Fewer than 1 diverted patient per ward per 10 night shifts"
    robustness_horizon_alpha_hat: "alpha_hat = 2.40 standard deviations of ward risk tolerated without violating r_c"
    opportuneness_horizon_beta_hat: "beta_hat = 0.90 deviations for windfall bed release r_w"
    global_maximin_safeguard: "Wald global Maximin floor: at least one float nurse on call hospital-wide, with reversible recall at the next shift handover"
  field_authorship:
    null_model: "clinical_operations_modeling_group"
    decision_rule: "nursing_workforce_planning"
    adversarial_reviewer: "independent_patient_safety_auditor"

data_and_audit_contract:
  dataset_path: "examples/clay/night_shift_overflow.csv"
  dataset_sha256: "9f1efc02081ef7db28dd13708ef467ef8b933d780f7e699fa5f13f026e553678"
  missingness_mechanism: "MCAR (simulated dataset with no missing shifts; Meng correlation rho_R_Y = 0; Manski bounds closed)"
  seed_and_environment: "seed=31; rustc=1.97; simulated dataset"
  null_model: "crates/stochology-cli#evaluate_empirical_card_severe_test_with_profile"
  preregistration_hash: "1ebdfd86a4221cc576d5c669184ae8892141ce0a0495aa824808915f4170bfda"
  attempt_counter_K: 1
  e_process_multiplicity: "Cumulative Ville e-process E_30 = 319.3 (threshold 1/alpha = 40.0 for alpha = 0.025)"
  murphy_corp_decomposition:
    total_score_brier_or_crps: 0.13564
    miscalibration_REL_MCB: 0.00264
    resolution_RES_DSC: 0.04470
    base_uncertainty_UNC0: 0.17770
  findings:
    registered: 2
    used: 1
    unused:
      - "Day-of-week admission effect discarded: no incremental RES_CORP on the development half"

decision_rule_and_scope:
  event_probability_p: 0.23112
  base_rate_floor_epsilon: 0.001
  protection_cost_C: 1200.0
  event_loss_L: 8000.0
  mitigation_efficacy_eta: 0.75
  critical_threshold_p_star: 0.20000
  declared_act: "protect"
  scope_statement: "Worked example on simulated ward-nights; does not apply to intensive care units or to any real hospital"
  who_pays_for_error: "Float nurses are allocated per ward-night by forecast risk, not across patient groups with distinct base rates; Chouldechova instrument waived in protocol_profile"
  exit_clause: "Suspend automated float-nurse calls if REL_CORP > 0.020 or RES_CORP < 0.020 over 14 consecutive nights"

protocol_profile:
  name: "night_shift_ward_overflow"
  rationale: "Shift-level nursing decision asked in Portuguese; stricter anytime-valid evidence (1/alpha = 40); dataset kept outside data/ under its own manifest"
  seed: 31
  e_process_min_inverse_alpha: 40.0
  resolution:
    fine_unit_terms: "plantão, plantões, turno, hora"
    coarse_horizon_terms: "anual, mensal, trimestral"
    coarse_aggregation_terms: "média, total, soma, único"
    coarse_phrases: "todos os plantões do ano"
  dataset_root: "examples/clay/"
  dataset_manifest: "examples/clay/SHA256SUMS"
  dataset_columns:
    cluster: "ward"
    forecast: "p_hat"
    outcome: "overflow"
    value: "excess_patients"
    jensen_loss: "square"
  severe_test:
    permutation_replications: 500
  waivers:
    PHI4_CHOULDECHOVA: "The action is allocated per ward-night by forecast risk; no protective action is split across patient groups with distinct base rates"
